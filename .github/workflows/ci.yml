name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Rust checks and offline build
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          ./scripts/cargo.sh fmt --all -- --check
          ./scripts/cargo.sh test --locked --all-targets
          ./scripts/cargo.sh clippy --locked --all-targets -- -D warnings
          ./scripts/cargo.sh build --locked --offline
      - name: Frontend regression tests
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Release validation tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_*.py' -v

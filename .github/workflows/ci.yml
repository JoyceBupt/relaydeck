name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          package_json_file: frontend/package.json
          cache: true
          cache_dependency_path: frontend/pnpm-lock.yaml
      - name: Rust checks and offline build
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          ./scripts/cargo.sh fmt --all -- --check
          ./scripts/cargo.sh test --locked --all-targets
          ./scripts/cargo.sh clippy --locked --all-targets -- -D warnings
          ./scripts/cargo.sh build --locked --offline
      - name: Frontend regression tests
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm run build
      - name: Linux shared-port kernel acceptance
        if: matrix.os == 'ubuntu-24.04'
        run: |
          test_binary=$(./scripts/cargo.sh test --locked --lib --no-run --message-format=json | python3 -c 'import json,sys; items=[json.loads(line) for line in sys.stdin]; print(next(item["executable"] for item in items if item.get("reason") == "compiler-artifact" and item.get("executable") and "lib" in item["target"]["kind"]))')
          sudo "$test_binary" linux::shared_port_kernel_tests::udp_listener_history_survives_apply_failure_and_excludes_upstream_and_host_sockets --ignored --exact --test-threads=1
      - name: Linux legacy panel update and root policy acceptance
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo env PYTHONDONTWRITEBYTECODE=1 RELAYDECK_POLICY_TEST=1 RELAYDECK_TEST_BINARY="$PWD/target/debug/relaydeck" python3 tests/policy_preparation.py -v
          sudo env PYTHONDONTWRITEBYTECODE=1 RELAYDECK_POLICY_TEST=1 RELAYDECK_TEST_BINARY="$PWD/target/debug/relaydeck" python3 -m unittest discover -s tests -p 'test_legacy_update.py' -v
      - name: Linux WireGuard forwarding acceptance
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends wireguard-tools
          test_binary=$(./scripts/cargo.sh test --locked --test linux_contract --no-run --message-format=json | python3 -c 'import json,sys; items=[json.loads(line) for line in sys.stdin]; print(next(item["executable"] for item in items if item.get("reason") == "compiler-artifact" and item.get("executable") and item["target"]["name"] == "linux_contract"))')
          sudo "$test_binary" wireguard_kernel_forwarding_preserves_target_isolation --ignored --exact --test-threads=1
      - name: Linux subscription quota enforcement acceptance
        if: matrix.os == 'ubuntu-24.04'
        run: |
          test_binary=$(./scripts/cargo.sh test --locked --test traffic --no-run --message-format=json | python3 -c 'import json,sys; items=[json.loads(line) for line in sys.stdin]; print(next(item["executable"] for item in items if item.get("reason") == "compiler-artifact" and item.get("executable") and item["target"]["name"] == "traffic"))')
          sudo "$test_binary" traffic_kernel_enforcement_and_recovery --ignored --exact --test-threads=1
      - name: Linux nonroot frontend and privileged startup acceptance
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo env PYTHONDONTWRITEBYTECODE=1 RELAYDECK_POLICY_TEST=1 RELAYDECK_SYSTEMD_TEST=1 RELAYDECK_TEST_BINARY="$PWD/target/debug/relaydeck" python3 tests/frontend_preparation.py -v
      - name: Isolated systemd failure and full recovery acceptance
        if: matrix.os == 'ubuntu-24.04'
        run: PYTHONDONTWRITEBYTECODE=1 python3 tests/run_runtime_acceptance.py
      - name: Release validation tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_*.py' -v

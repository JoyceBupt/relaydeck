name: Linux release bundles
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          package_json_file: frontend/package.json
          cache: true
          cache_dependency_path: frontend/pnpm-lock.yaml
      - name: Build frontend and validate packages
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm run build
      - name: Validate release packages
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Build Linux binaries on Debian 12
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "$PWD:/workspace" --workdir /workspace \
            --env CARGO_HOME=/tmp/relaydeck-cargo --env RUSTUP_TOOLCHAIN=1.99.0 \
            rust:1.99-bookworm@sha256:59037199c44290f2befcdd58dcc540164763fc296950255aaefeef096a1866b0 \
            sh -c 'cargo test --locked --all-targets && cargo build --release --locked && python3 scripts/manage.py package --target "$(rustc -vV | sed -n "s/^host: //p")"'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: relaydeck-${{ runner.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: relaydeck-*
          path: release-assets
          merge-multiple: true
      - name: Verify tag and both release architectures
        run: |
          python3 - <<'PY'
          import glob, hashlib, json, os, pathlib, re, tarfile
          assert re.fullmatch(r'v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)', os.environ['GITHUB_REF_NAME']), 'Publish stable version tags only'
          found = set()
          for name in glob.glob('release-assets/*.tar.gz'):
              with tarfile.open(name) as archive:
                  manifest = json.load(archive.extractfile('release.json'))
              assert os.environ['GITHUB_REF_NAME'] == 'v' + manifest['version'], 'Tag must match Cargo version'
              assert manifest['revision'] == os.environ['GITHUB_SHA'], 'Release must match the tagged commit'
              assert manifest['target'] not in found, 'Duplicate architecture'
              found.add(manifest['target'])
              expected = pathlib.Path(name + '.sha256').read_text().split()[0]
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() == expected
          assert found == {'x86_64-unknown-linux-gnu', 'aarch64-unknown-linux-gnu'}
          PY
      - name: Publish complete stable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --generate-notes --target "$GITHUB_SHA" release-assets/*.tar.gz release-assets/*.sha256
          gh release edit "$GITHUB_REF_NAME" --draft=false

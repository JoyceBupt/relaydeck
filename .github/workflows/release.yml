name: Linux release bundles
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          package_json_file: frontend/package.json
          cache: true
          cache_dependency_path: frontend/pnpm-lock.yaml
      - name: Build frontend and validate packages
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm run build
      - name: Validate release packages
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Build Linux binaries on Debian 12
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "$PWD:/workspace" --workdir /workspace \
            --env CARGO_HOME=/tmp/relaydeck-cargo --env RUSTUP_TOOLCHAIN=1.99.0 \
            rust:1.99-bookworm@sha256:59037199c44290f2befcdd58dcc540164763fc296950255aaefeef096a1866b0 \
            sh -c 'cargo test --locked --all-targets && cargo build --release --locked && python3 scripts/manage.py package --target "$(rustc -vV | sed -n "s/^host: //p")"'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: relaydeck-${{ runner.arch }}
          path: dist/*
          if-no-files-found: error
